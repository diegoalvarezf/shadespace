name: Shadespace
options:
  bundleIdPrefix: com.diegoalvarezfrancos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # A stable signing identity keeps macOS privacy grants (Automation, Location, Bluetooth)
    # across rebuilds; ad-hoc builds get a new identity every time.
    DEVELOPMENT_TEAM: ZBL544FP3Q
    CODE_SIGN_IDENTITY: "Apple Development"
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shadespace:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - ShadespaceTests
    sources:
      - path: Sources/Shadespace
    resources:
      - path: Sources/Shadespace/Resources
    info:
      path: Sources/Shadespace/App/Info.plist
      properties:
        CFBundleName: Shadespace
        CFBundleDisplayName: Shadespace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: "Shadespace uses Apple Events to show and control what's playing in Spotify and Music."
        NSBluetoothAlwaysUsageDescription: "Shadespace shows your AirPods' battery when they connect."
        NSLocationUsageDescription: "Shadespace uses your approximate location to show the local weather."
        NSLocationWhenInUseUsageDescription: "Shadespace uses your approximate location to show the local weather."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: Sources/Shadespace/App/Shadespace.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoalvarezfrancos.shadespace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ShadespaceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ShadespaceTests
    dependencies:
      - target: Shadespace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoalvarezfrancos.shadespace.tests
        GENERATE_INFOPLIST_FILE: YES
